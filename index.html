<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#11151c" />
  <title>CogRush</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #11151c; color: #e6edf3; font: 14px/1.3 system-ui, sans-serif; overscroll-behavior: none; touch-action: none; user-select: none; }
    #app { display: flex; flex-direction: column; height: 100dvh; max-width: 520px; margin: 0 auto; padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom); }
    #hud { white-space: nowrap; font-size: 13px; display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 8px 4px; font-variant-numeric: tabular-nums; }
    #hud b { font-size: 16px; }
    #lane { flex: 1; min-height: 0; position: relative; }
    #bar { min-height: 64px; display: flex; gap: 8px; align-items: center; padding: 8px 0; }
    #msg { flex: 1; color: #9aa7b4; }
    #msg.warn { color: #ff6b6b; font-weight: 600; }
    button { min-height: 48px; min-width: 48px; padding: 0 16px; border: 0; border-radius: 10px; background: #2f81f7; color: #fff; font: 600 15px system-ui, sans-serif; }
    button.danger { background: #d1242f; }
    button.ghost { background: #2a313c; min-height: 36px; padding: 0 10px; font-size: 13px; }
    button:disabled { opacity: .4; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <span>❤ <b id="lives"></b></span>
      <span>⚙ <b id="gold"></b> <small id="income"></small></span>
      <span id="wave"></span>
      <span id="clock"></span>
      <button id="restart" class="ghost">Restart</button>
    </div>
    <div id="lane"></div>
    <div id="bar">
      <span id="msg">Tap a cell to build.</span>
      <button id="act" hidden></button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
